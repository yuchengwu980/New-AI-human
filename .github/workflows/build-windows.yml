name: Build Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name NewAIHuman --add-data "scripts;scripts" app/desktop/main_desktop.py

      - name: Stage zip payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/NewAIHuman/output/audio | Out-Null
          New-Item -ItemType Directory -Force dist/NewAIHuman/output/events | Out-Null
          Copy-Item docs/README_使用说明.txt dist/NewAIHuman/README_使用说明.txt -Force
          Compress-Archive -Path dist/NewAIHuman/* -DestinationPath NewAIHuman_Win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewAIHuman_Win64
          path: NewAIHuman_Win64.zip
